<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Мөнхбаатарын сагс</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&family=Orbitron:wght@600;800&display=swap">
<style>
/* Layout: дээр нь цэнгэлдэх хүрээлэнгийн онооны самбар, доор нь 4 таб — дасгалжуулагч, тоглолт, торгуулийн шидэлт, миний хүснэгт; нэг баганатай */
:root {
  --bg: #edf0f5; --panel: #ffffff; --ink: #131a2c; --muted: #59627a; --line: #d5dae5;
  --ball: #e4570f; --ball-ink: #ffffff; --ball-soft: #fde3d3;
  --court: #1f3f94; --court-soft: #e1e8fa;
  --good: #147a4b; --good-soft: #d8f1e4; --bad: #c22f2f; --bad-soft: #fae0e0;
  --board: #0d111c; --board-line: #262e44; --board-text: #c4cbdb; --led: #ffb21e; --led-dim: #4a3a14;
  --display: 'Russo One', 'Arial Black', sans-serif;
  --body: 'Rubik', 'Segoe UI', -apple-system, sans-serif;
  --digits: 'Orbitron', 'Russo One', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0d15; --panel: #131826; --ink: #edf0f7; --muted: #9aa3ba; --line: #262d42;
  --ball: #ff7631; --ball-ink: #1a0a00; --ball-soft: #3a2214;
  --court: #8eaaff; --court-soft: #1a2440;
  --good: #43c487; --good-soft: #10301f; --bad: #ff7b7b; --bad-soft: #3a1818;
  --board: #04060b; --board-line: #1f2638; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0d15; --panel: #131826; --ink: #edf0f7; --muted: #9aa3ba; --line: #262d42;
  --ball: #ff7631; --ball-ink: #1a0a00; --ball-soft: #3a2214;
  --court: #8eaaff; --court-soft: #1a2440;
  --good: #43c487; --good-soft: #10301f; --bad: #ff7b7b; --bad-soft: #3a1818;
  --board: #04060b; --board-line: #1f2638; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em }
h2 { font-size: clamp(21px, 4.5vw, 26px) }
h3 { font-size: 18px }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent }
button:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px }
.muted { color: var(--muted) }
.lbl { font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase }
.led { font-family: var(--digits); font-weight: 800; color: var(--led); text-shadow: 0 0 10px rgba(255, 178, 30, 0.45); font-variant-numeric: tabular-nums; line-height: 1 }

/* Онооны самбар */
.board { background: var(--board); color: var(--board-text); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; border: 2px solid var(--board-line) }
.board-top { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.team { display: flex; align-items: center; gap: 12px; min-width: 0 }
.team svg { width: 46px; height: 46px; flex-shrink: 0 }
.team h1 { font-size: clamp(20px, 5vw, 28px); color: #ffffff; line-height: 1.1 }
.team .lbl { color: var(--led) }
.sound { background: transparent; border: 2px solid var(--board-line); color: var(--board-text); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; flex-shrink: 0 }
.cells { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 8px }
.cell { background: #000000; border: 1px solid var(--board-line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden }
.cell .lbl { letter-spacing: 0.05em }
.cell .led { font-size: clamp(24px, 6vw, 32px) }
.cell small { font-family: var(--digits); color: var(--led-dim); font-size: 14px }
.cell .rank { font-family: var(--display); color: #ffffff; font-size: clamp(15px, 3.6vw, 19px); line-height: 1.15 }

/* Табууд */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 5px }
.tab { border: none; background: transparent; border-radius: 11px; padding: 9px 4px; font-weight: 700; font-size: 14px; line-height: 1.2; color: var(--muted) }
.tab[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink) }
@media (max-width: 430px) { .tab { font-size: 12.5px } }

.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: clamp(16px, 4vw, 26px); display: flex; flex-direction: column; gap: 18px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.big { background: var(--ball); color: var(--ball-ink); border: none; border-radius: 14px; padding: 14px 24px; font-family: var(--display); font-size: 18px; letter-spacing: 0.02em }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 12px; padding: 10px 16px; font-weight: 700 }
.ghost.danger { color: var(--bad); border-color: var(--bad) }
.sec { display: flex; flex-direction: column; gap: 12px }
.sec + .sec { border-top: 2px dashed var(--line); padding-top: 20px }

/* 100 → 15 */
.shrink { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 210px); gap: 16px; align-items: start }
@media (max-width: 560px) { .shrink { grid-template-columns: minmax(0, 1fr) } }
.mini { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px }
.mini i { aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--ball); display: grid; place-items: center; font-style: normal; font-size: clamp(9px, 2.2vw, 12px); font-weight: 700; color: var(--ball-ink); transition: background .35s, color .35s, transform .35s; font-variant-numeric: tabular-nums }
.mini i.gone { background: var(--bg); color: var(--line); transform: scale(.86) }
.counter { background: var(--board); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; color: var(--board-text) }
.counter .led { font-size: 48px }
.counter b.step { color: #ffffff; font-family: var(--display); font-weight: 400; font-size: 17px }
.counter p { font-size: 14px }

/* 9-ийн хуруу */
.hands { display: flex; justify-content: center; gap: clamp(10px, 4vw, 26px); padding: 6px 0 }
.hand { display: flex; align-items: flex-end; gap: clamp(3px, 1.2vw, 7px); height: 110px }
.finger { width: clamp(22px, 6.4vw, 34px); height: 96px; border-radius: 14px 14px 8px 8px; border: 2px solid var(--line); background: var(--court-soft); display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; font-size: 12px; font-weight: 700; color: var(--muted); transition: height .2s, background .2s }
.hand .finger:nth-child(1), .hand.r .finger:nth-child(5) { height: 66px }
.hand .finger:nth-child(2), .hand.r .finger:nth-child(4) { height: 88px }
.hand .finger:nth-child(3) { height: 100px }
.hand .finger:nth-child(4), .hand.r .finger:nth-child(2) { height: 92px }
.hand .finger:nth-child(5), .hand.r .finger:nth-child(1) { height: 76px }
.hand.r .finger:nth-child(3) { height: 100px }
.finger.down { height: 34px !important; background: var(--ball); color: var(--ball-ink); border-color: var(--ball) }
.nine { text-align: center; font-size: 18px; min-height: 54px }
.nine b { font-family: var(--digits); font-size: 26px; color: var(--ball) }

/* Дүрмийн картууд */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px }
.rule { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.rule .tag { align-self: flex-start; font-family: var(--digits); font-weight: 800; font-size: 13px; background: var(--court-soft); color: var(--court); border-radius: 8px; padding: 2px 8px }
.rule b { font-size: 16px }
.rule code { font-family: var(--digits); font-size: 14px; color: var(--ball); font-weight: 600 }

/* Тоглолтын дэлгэц */
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: var(--board); border-radius: 16px; padding: 10px; color: var(--board-text) }
.hud > div { display: flex; flex-direction: column; align-items: center; gap: 4px }
.hud .led { font-size: clamp(26px, 7vw, 36px) }
.hud .led.low { color: #ff5a4a; text-shadow: 0 0 10px rgba(255, 90, 74, .5) }
.shot { display: flex; flex-direction: column; align-items: center; gap: 10px }
.q { font-family: var(--digits); font-weight: 800; font-size: clamp(44px, 13vw, 64px); line-height: 1.1; font-variant-numeric: tabular-nums }
.q .x { color: var(--ball) }
.ans { min-width: 150px; min-height: 66px; border: 3px solid var(--line); border-radius: 16px; display: grid; place-items: center; font-family: var(--digits); font-weight: 800; font-size: 38px; padding: 4px 18px; font-variant-numeric: tabular-nums }
.ans.ok { border-color: var(--good); background: var(--good-soft); color: var(--good) }
.ans.no { border-color: var(--bad); background: var(--bad-soft); color: var(--bad) }
.ans .ph { font-family: var(--body); font-size: 15px; font-weight: 500; color: var(--muted) }
.zone { width: min(260px, 100%); display: flex; flex-direction: column; gap: 3px; align-items: center }
.zone .bar { width: 100%; height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden }
.zone .bar i { display: block; height: 100%; width: 100%; background: var(--ball); border-radius: 999px }
.zone span { font-size: 12px; color: var(--muted); font-weight: 700 }
.say { min-height: 28px; font-weight: 700; font-size: 18px; text-align: center }
.say.ok { color: var(--good) } .say.no { color: var(--bad) } .say.fire { color: var(--ball) }
.tip { background: var(--court-soft); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 15px; width: 100% }
.tip b { color: var(--court) }

.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(340px, 100%); margin: 0 auto; user-select: none; -webkit-user-select: none }
.pad button { border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 12px 0; font-family: var(--digits); font-weight: 800; font-size: 24px; min-height: 56px }
.pad button:active { transform: scale(.96) }
.pad .go { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); font-family: var(--display); font-size: 18px; font-weight: 400 }
.pad .del { font-family: var(--body); font-size: 15px; font-weight: 700 }
.progress { height: 10px; border-radius: 999px; background: var(--bg); overflow: hidden; border: 2px solid var(--line) }
.progress i { display: block; height: 100%; background: var(--ball); transition: width .3s }

/* Дүн */
.result { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center }
.result .final { font-family: var(--digits); font-weight: 800; font-size: 64px; color: var(--ball); line-height: 1 }
.facts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }
.fact { border: 2px solid var(--line); border-radius: 10px; padding: 4px 10px; font-family: var(--digits); font-weight: 600; font-size: 14px }
.fact.m { border-color: var(--good); background: var(--good-soft); color: var(--good) }
.fact.l { border-color: var(--ball); background: var(--ball-soft) }
.misslist { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left }

/* Миний хүснэгт */
.gridwrap { overflow-x: auto }
.grid { display: grid; grid-template-columns: repeat(11, minmax(26px, 1fr)); gap: 3px; min-width: 300px }
.grid .h { display: grid; place-items: center; font-family: var(--digits); font-weight: 800; font-size: 12px; color: var(--court); padding: 4px 0 }
.grid button { aspect-ratio: 1; max-width: 100%; border: 2px solid var(--line); background: var(--panel); border-radius: 7px; padding: 0; font-size: clamp(10px, 2.6vw, 14px); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted) }
.grid button.l { background: var(--ball-soft); border-color: var(--ball); color: var(--ink) }
.grid button.m { background: var(--good-soft); border-color: var(--good); color: var(--good) }
.grid button.sel { outline: 3px solid var(--court); outline-offset: 1px }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--line); display: inline-block }
.legend i.l { background: var(--ball-soft); border-color: var(--ball) }
.legend i.m { background: var(--good-soft); border-color: var(--good) }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 999px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); text-align: center }
@keyframes pop { 0% { transform: scale(.9) } 60% { transform: scale(1.06) } 100% { transform: scale(1) } }
@keyframes drop { 0% { transform: translateY(-14px); opacity: .4 } 100% { transform: none; opacity: 1 } }
.pop { animation: pop .3s }
.drop { animation: drop .25s ease-out }
@media (prefers-reduced-motion: reduce) { .pop, .drop { animation: none } .mini i, .finger, .progress i { transition: none } }
</style>

<div class="wrap">
  <header class="board">
    <div class="board-top">
      <div class="team">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#f06a1f"/><g fill="none" stroke="#1a0d05" stroke-width="2.2"><circle cx="24" cy="24" r="22"/><path d="M2 24h44M24 2v44"/><path d="M9 8c8 7 8 25 0 32M39 8c-8 7-8 25 0 32"/></g></svg>
        <div><span class="lbl">Тоглогч №10</span><h1>Мөнхбаатар</h1></div>
      </div>
      <button class="sound" id="sound" aria-pressed="true">Дуу: асаалттай</button>
    </div>
    <div class="cells">
      <div class="cell"><span class="lbl">Оноо</span><b class="led" id="pts">0</b></div>
      <div class="cell"><span class="lbl">Эзэмшсэн</span><div><b class="led" id="mast">0</b><small>/100</small></div></div>
      <div class="cell"><span class="lbl">Цол</span><b class="rank" id="rank">Шинэ тоглогч</b></div>
    </div>
  </header>

  <nav class="tabs" aria-label="Хэсэг">
    <button class="tab" data-tab="coach" aria-pressed="true">Дасгал­жуулагч</button>
    <button class="tab" data-tab="match" aria-pressed="false">Тоглолт</button>
    <button class="tab" data-tab="free" aria-pressed="false">Торгууль</button>
    <button class="tab" data-tab="chart" aria-pressed="false">Миний хүснэгт</button>
  </nav>

  <main class="panel" id="view" aria-live="polite"></main>
</div>

<script>
/* ---------------- Хадгалалт ---------------- */
var store = {
  get: function (k, d) { try { var v = localStorage.getItem('ms.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('ms.' + k, JSON.stringify(v)); } catch (e) { /* хувийн горим */ } }
};
var points = store.get('points', 0);
var bestMatch = store.get('best', 0);
var soundOn = store.get('sound', true);
var stats = store.get('stats', {}); // "3x7": { s: дараалсан зөв, n: оролдлого }

var $ = function (sel) { return document.querySelector(sel); };
var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
var view = $('#view');
var shuffle = function (a) { var b = a.slice(); for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; } return b; };
var key = function (a, b) { return Math.min(a, b) + 'x' + Math.max(a, b); };
var stateOf = function (a, b) { var st = stats[key(a, b)]; return !st ? '' : st.s >= 3 ? 'm' : 'l'; };

var HARD = [];
[3, 4, 6, 7, 8].forEach(function (a, i, arr) { arr.slice(i).forEach(function (b) { HARD.push([a, b]); }); });
var RANKS = [[0, 'Шинэ тоглогч'], [50, 'Сэлгээний тоглогч'], [150, 'Үндсэн тоглогч'], [300, 'Онооны машин'], [500, 'Багийн ахлагч'], [800, 'Бүх оддын тоглогч'], [1200, 'MVP'], [2000, 'Домог']];

/* ---------------- Дүрэм: баримт бүрт тохирох зөвлөгөө ---------------- */
function trick(a, b) {
  var x = Math.min(a, b), y = Math.max(a, b), p = a * b;
  if (x === 1) return '1-ээр үржүүлэхэд тоо өөрчлөгдөхгүй: ' + y + ' × 1 = ' + y;
  if (y === 10) return '10-аар үржүүлэхэд ард нь 0 залгана: ' + x + ' → ' + p;
  if (x === 7 && y === 8) return '«5-6-7-8» гэж уншаарай: 56 = 7 × 8';
  if (x === 6 && y === 8) return 'Хөршийн дүрэм: 7 × 7 = 49, нэгийг хасвал 6 × 8 = 48';
  if (x === y) return 'Ихэр тоо (квадрат): ' + x + ' × ' + x + ' = ' + p + '. Ихрүүдийг тусад нь цээжил.';
  var pri = [2, 5, 9, 4, 3, 8, 6];
  var f = pri.filter(function (n) { return n === x || n === y; })[0];
  var o = f === x ? y : x;
  if (f === 2) return 'Давхарла: ' + o + ' + ' + o + ' = ' + p;
  if (f === 5) return '×10-ын хагас: ' + o + ' × 10 = ' + o * 10 + ', хагас нь ' + p;
  if (f === 9) return '×10 − тоо: ' + o * 10 + ' − ' + o + ' = ' + p + '. Цифрүүдийн нийлбэр ' + String(p).split('').join(' + ') + ' = 9';
  if (f === 4) return 'Хоёр удаа давхарла: ' + o + ' → ' + o * 2 + ' → ' + p;
  if (f === 3) return '×2 дээр нэг ' + o + ' нэм: ' + o * 2 + ' + ' + o + ' = ' + p;
  if (f === 8) return 'Гурван удаа давхарла: ' + o + ' → ' + o * 2 + ' → ' + o * 4 + ' → ' + p;
  return '×5 дээр нэг ' + o + ' нэм: ' + o * 5 + ' + ' + o + ' = ' + p;
}

/* ---------------- Оноо, цол ---------------- */
function rankOf(p) { var r = RANKS[0][1]; RANKS.forEach(function (x) { if (p >= x[0]) r = x[1]; }); return r; }
function masteredCount() { var n = 0; for (var a = 1; a <= 10; a++) for (var b = 1; b <= 10; b++) if (stateOf(a, b) === 'm') n++; return n; }
function renderBoard() {
  $('#pts').textContent = points;
  $('#mast').textContent = masteredCount();
  $('#rank').textContent = rankOf(points);
  var s = $('#sound'); s.textContent = soundOn ? 'Дуу: асаалттай' : 'Дуу: унтраалттай'; s.setAttribute('aria-pressed', String(soundOn));
}
function addPoints(n) {
  var before = rankOf(points); points += n; store.set('points', points); renderBoard();
  var after = rankOf(points); if (after !== before) toast('Шинэ цол: ' + after + '!');
}
function record(a, b, ok) {
  var k = key(a, b), st = stats[k] || { s: 0, n: 0 };
  var was = st.s >= 3;
  st.n++; st.s = ok ? st.s + 1 : 0; stats[k] = st; store.set('stats', stats); renderBoard();
  return !was && st.s >= 3; // шинээр эзэмшсэн
}
var toastTimer;
function toast(t) {
  var el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
}

/* ---------------- Дуу: сагсанд орох, дохио, цагийн дуут дохио ---------------- */
var ac = null;
function audio() {
  if (!soundOn) return null;
  try { if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); } if (ac.state === 'suspended') ac.resume(); return ac; } catch (e) { return null; }
}
function tone(type, f1, f2, dur, vol) {
  var c = audio(); if (!c) return;
  try {
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);

      (sel ? '<div class="tip pop"><b>' + sel[0] + ' × ' + sel[1] + ' = ' + sel[0] * sel[1] + '</b> · ' + trick(sel[0], sel[1]) + '</div>' : '<p class="muted">Нүдэн дээр дарвал тухайн баримтын дүрэм гарна.</p>') +
      '<div class="row"><button class="ghost danger" id="reset">' + (confirmReset ? 'Тийм, бүгдийг арилга' : 'Ахицыг шинээр эхлүүлэх') + '</button>' +
      (confirmReset ? '<button class="ghost" id="cancel">Болих</button>' : '') + '</div>';
    $$('.grid button').forEach(function (b) { b.addEventListener('click', function () { sel = [+b.dataset.a, +b.dataset.b]; confirmReset = false; draw(); }); });
    $('#reset').addEventListener('click', function () {
      if (!confirmReset) { confirmReset = true; draw(); return; }
      stats = {}; points = 0; bestMatch = 0; store.set('stats', stats); store.set('points', 0); store.set('best', 0);
      confirmReset = false; renderBoard(); draw(); toast('Ахиц шинээр эхэллээ');
    });
    if (confirmReset) $('#cancel').addEventListener('click', function () { confirmReset = false; draw(); });
  }
  draw();
}

renderBoard();
Coach();
</script>
</body>
</html>
